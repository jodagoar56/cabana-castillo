<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Ganado</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f4f4;
            color: #333;
            line-height: 1.6;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            margin: auto;
            overflow: hidden;
            padding: 20px;
        }
        header {
            background: #0056b3; /* Azul más sólido para el header */
            color: #fff;
            padding: 1rem 1rem; /* Reducido el padding vertical */
            text-align: center;
            border-bottom: #ffc107 5px solid; /* Amarillo para el borde */
        }
        header h1 {
            margin: 0;
            font-size: 2em; /* Reducido el tamaño de fuente */
            letter-spacing: 1px;
        }
        
        form {
            background: #fff;
            padding: 20px;
            margin-top: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        form label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        form input[type="text"],
        form input[type="number"],
        form select {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        form button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s ease;
        }
        form button:hover {
            background-color: #0056b3;
        }

        #animalCardsContainer {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .animal-card {
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: box-shadow 0.3s ease;
        }
        .animal-card:hover {
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }
        .animal-card h3 {
            color: #0056b3;
            margin-top: 0;
            margin-bottom: 10px;
            font-size: 1.4em;
        }
        .animal-card p {
            font-size: 0.95em;
            margin-bottom: 8px;
            color: #555;
        }
        .animal-card strong {
            color: #333;
        }
        .animal-card .actions button {
            padding: 8px 12px;
            margin-right: 8px;
            font-size: 0.9em;
            border-radius: 4px;
        }
        .animal-card .edit-btn {
            background-color: #ffc107;
            color: #333;
        }
        .animal-card .edit-btn:hover {
            background-color: #e0a800;
        }
        .animal-card .delete-btn {
            background-color: #dc3545;
            color: white;
        }
        .animal-card .delete-btn:hover {
            background-color: #c82333;
        }

        footer {
            text-align: center;
            padding: 20px;
            margin-top: 30px;
            background: #333;
            color: #fff;
            font-size: 0.9em;
        }
    </style>
</head>
<body>

    <header>
        <div class="container">
            <h1>Registro y Gestión de Animales</h1>
        </div>
    </header>

    <div class="container">
        <form id="animalForm">
            <input type="hidden" id="animalId" name="animalId">
            
            <div>
                <label for="nombre">Nombre del Animal:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>
            
            <div>
                <label for="identificador">Identificador Único (Ej: Nº Arete):</label>
                <input type="text" id="identificador" name="identificador" required>
            </div>
            
            <div>
                <label for="raza">Raza:</label>
                <input type="text" id="raza" name="raza" list="razasSugeridas" required>
                <datalist id="razasSugeridas">
                    <option value="Holstein">
                    <option value="Jersey">
                    <option value="Pardo Suizo">
                    <option value="Criolla">
                    <option value="Angus">
                    <option value="Hereford">
                    <option value="Brahman">
                    <option value="Simmental">
                    <option value="Normando">
                    <option value="Gyr">
                </datalist>
            </div>
            
            <div>
                <label for="tipoAnimal">Tipo de Animal:</label>
                <select id="tipoAnimal" name="tipoAnimal" required>
                    <option value="">Seleccione...</option>
                    <option value="Lechero">Lechero</option>
                    <option value="Carne">Carne</option>
                    <option value="Doble Propósito">Doble Propósito</option>
                </select>
            </div>
            
            <div id="produccionLecheDiv" style="display: none;">
                <label for="produccionLeche">Producción de Leche Inicial (L/día):</label>
                <input type="number" id="produccionLeche" name="produccionLeche" step="0.1" min="0">
            </div>
            
            <button type="submit">Guardar Animal</button>
        </form>

        <section id="animalListSection">
            <h2>Listado de Animales</h2>
            <div id="animalCardsContainer">
                <!-- Las tarjetas de animales se insertarán aquí por JavaScript -->
            </div>
        </section>
    </div>

    <footer>
        <div class="container">
            <p>&copy; 2024 Gestión de Ganado - Adaptado de Cabaña Castillo House Club</p>
        </div>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
</body>
</html>
