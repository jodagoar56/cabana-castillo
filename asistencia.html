<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Asistencia Profesional</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
    <meta name="theme-color" content="#0d9488">
</head>
<body class="bg-gray-100">
    <main class="max-w-3xl mx-auto p-4">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold">Registro de Asistencia Profesional</h1>
            <p class="text-gray-600">Grupo ETV Zona Norte</p>
        </header>
        <section class="mb-4">
            <label for="fecha" class="block mb-2 font-semibold">Fecha:</label>
            <input id="fecha" type="date" class="border rounded p-2 w-full md:w-1/3">
        </section>
        <section id="lista-gestores" class="space-y-2 mb-4">
            <!-- Lista de gestores -->
        </section>
        <div class="flex gap-2 mb-4">
            <button id="btn-resumen" class="bg-blue-500 text-white px-4 py-2 rounded">Ver Resumen Diario</button>
            <button id="btn-guardar" class="bg-green-500 text-white px-4 py-2 rounded">Guardar y Descargar PDF</button>
        </div>
        <div id="mensaje" class="mb-4 text-center text-red-600 hidden"></div>
        <div id="resumen" class="hidden">
            <h2 class="font-semibold mb-2">Asistencia registrada:</h2>
            <ul id="lista-resumen" class="list-disc ml-5 mb-2"></ul>
            <p id="faltantes" class="font-semibold"></p>
        </div>
    </main>
    <script>
        const gestores = [
            "ALEXIS DE JESUS GUERRA DIAZ", "ANDRES ENRIQUE BARRETO OCHOA", "BENIGNO RAFAEL BERTEL TUIRAN", "CATALINA PAOLA RAMIREZ ZABALA",
            "DAILER DAVID HERAZO BELLO", "DANIEL ANDRES FUENTES ALVAREZ", "EDUARDO LUIS BENITEZ MERCADO", "JADER ANTONIO SOLAR BENITEZ",
            "JESUS DAVID ENAMORADO OLIVEROS", "JESUS DAVID MENDOZA ESALAS", "JHONATAN MARQUEZ PINEDA", "JORGE IVAN ACOSTA MENDOZA",
            "JUDITH DEL CARMEN CHAVEZ BLANQUISETH", "KATERIN PAOLA FERNANDEZ ROMERO", "KEINER DAVID DIAZ GONZALES", "LAURA VANESSA ARRIETA HOYOS",
            "LIZETH PAOLA RODRIGUEZ TOSCANO", "LUIS YESID PEREZ VILORIA", "LUISA FERNANDA ARRIETA HOYOS", "MAURICIO JAVIER AGUAS MERCADO",
            "MICHEL KAROLINA ARRIETA HOYOS", "NORELYS ROMERO GONZALES", "OSCAR DAVID MERCADO", "VALENTINA MORALES BERRIO",
            "YEINER DAVID GUERRERO SALCEDO", "YIRLEIDIS PAOLA DE LA CRUZ ROMERO", "YUDIS ISABEL BOLAÑO PEREZ",
            "YULETH PAOLA ACOSTA ZAPATA", "PAUL ATENCIA", "DANIELA PEREZ", "LUIS MARIO SOLAR BENITEZ",
            "MARIO HERNÁNDEZ", "LUIS SARRIA", "DIEGO NARVAEZ", "BLEIDYS ARRIETA HOYOS"
        ].sort();

        document.addEventListener('DOMContentLoaded', () => {
            const fechaInput = document.getElementById('fecha');
            fechaInput.valueAsDate = new Date();
            const contenedor = document.getElementById('lista-gestores');

            gestores.forEach((nombre, idx) => {
                const wrapper = document.createElement('div');
                wrapper.className = 'flex items-center gap-2';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.id = 'g' + idx;
                cb.className = 'h-4 w-4';

                const label = document.createElement('label');
                label.htmlFor = cb.id;
                label.textContent = nombre;
                label.className = 'flex-1';

                const span = document.createElement('span');
                span.className = 'text-sm text-gray-500 hidden';

                cb.addEventListener('change', () => {
                    if (cb.checked) {
                        const hora = new Date().toLocaleTimeString();
                        cb.dataset.arrivalTime = hora;
                        span.textContent = hora;
                        span.classList.remove('hidden');
                    } else {
                        delete cb.dataset.arrivalTime;
                        span.textContent = '';
                        span.classList.add('hidden');
                    }
                });

                wrapper.append(cb, label, span);
                contenedor.appendChild(wrapper);
            });

            document.getElementById('btn-resumen').addEventListener('click', mostrarResumenVisual);
            document.getElementById('btn-guardar').addEventListener('click', procesarAsistencia);

            if ('serviceWorker' in navigator) {
                const swCode = `
                    const CACHE = 'asistencia-etv-v1';
                    const assets = [
                        '/',
                        location.pathname,
                        'https://cdn.jsdelivr.net/npm/tailwindcss@3.4.4/dist/tailwind.min.css',
                        'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
                        'https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js'
                    ];
                    self.addEventListener('install', e => {
                        e.waitUntil(caches.open(CACHE).then(c => c.addAll(assets)));
                    });
                    self.addEventListener('activate', e => {
                        e.waitUntil(
                            caches.keys().then(keys => Promise.all(keys.map(k => k !== CACHE && caches.delete(k))))
                        );
                    });
                    self.addEventListener('fetch', e => {
                        e.respondWith(
                            caches.match(e.request).then(r => r || fetch(e.request).then(res => {
                                const clone = res.clone();
                                caches.open(CACHE).then(c => c.put(e.request, clone));
                                return res;
                            }))
                        );
                    });
                `;
                const blob = new Blob([swCode], {type: 'text/javascript'});
                navigator.serviceWorker.register(URL.createObjectURL(blob));
            }
        });

        function mostrarResumenVisual() {
            const listaResumen = document.getElementById('lista-resumen');
            const faltantesEl = document.getElementById('faltantes');
            listaResumen.innerHTML = '';
            const checks = document.querySelectorAll('#lista-gestores input[type=checkbox]');
            let presentes = 0;
            checks.forEach(cb => {
                if (cb.checked) {
                    presentes++;
                    const li = document.createElement('li');
                    const label = document.querySelector(`label[for="${cb.id}"]`);
                    li.textContent = `${label.textContent} - ${cb.dataset.arrivalTime}`;
                    listaResumen.appendChild(li);
                }
            });
            const faltantes = gestores.length - presentes;
            faltantesEl.textContent = `Faltan por registrar: ${faltantes} persona(s)`;
            document.getElementById('resumen').classList.remove('hidden');
        }

        function procesarAsistencia() {
            const fecha = document.getElementById('fecha').value;
            const mensaje = document.getElementById('mensaje');
            if (!fecha) {
                mensaje.textContent = 'Debe seleccionar una fecha.';
                mensaje.classList.remove('hidden');
                return;
            }
            mensaje.classList.add('hidden');

            const checks = document.querySelectorAll('#lista-gestores input[type=checkbox]');
            const data = [];
            const asistencias = {};
            checks.forEach(cb => {
                const label = document.querySelector(`label[for="${cb.id}"]`);
                const nombre = label.textContent;
                const presente = cb.checked;
                const hora = cb.dataset.arrivalTime || 'N/A';
                data.push({ nombre, presente, hora });
                asistencias[nombre] = { presente, horaLlegada: hora };
            });
            const fechaISO = new Date(fecha).toISOString().slice(0,10);
            const fechaFormateada = new Date(fecha).toLocaleDateString();
            const registro = { fechaISO, fechaFormateada, asistencias };
            try {
                const clave = 'registros_asistencia_etv_norte';
                const store = JSON.parse(localStorage.getItem(clave) || '{}');
                store[fechaISO] = registro;
                localStorage.setItem(clave, JSON.stringify(store));
            } catch (err) {
                mensaje.textContent = err.name === 'QuotaExceededError' ? 'Espacio insuficiente para guardar los datos.' : 'Error al guardar.';
                mensaje.classList.remove('hidden');
                return;
            }
            generarPDFConTabla(data, fechaFormateada);
        }

        function generarPDFConTabla(data, fechaFormateada) {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text(`Reporte de Asistencia - ${fechaFormateada}`, 105, 15, { align: 'center' });
            const presentes = data.filter(d => d.presente).sort((a,b) => a.nombre.localeCompare(b.nombre));
            const ausentes = data.filter(d => !d.presente).sort((a,b) => a.nombre.localeCompare(b.nombre));
            const ordenados = [...presentes, ...ausentes];
            const rows = ordenados.map((d, i) => [i + 1, d.presente ? 'Presente' : 'Ausente', d.nombre, d.hora]);
            doc.autoTable({
                head: [['Nº', 'Estado', 'Nombre del Gestor', 'Hora de Llegada']],
                body: rows,
                styles: { halign: 'center' },
                didDrawCell: dataArg => {
                    if (dataArg.section === 'body' && dataArg.column.index === 1) {
                        const estado = dataArg.cell.raw;
                        const pos = dataArg.cell.textPos;
                        doc.text(estado === 'Presente' ? '✅' : '❌', pos.x + 2, pos.y + 2, { color: estado === 'Presente' ? 'green' : 'red' });
                        dataArg.cell.text = '';
                    }
                }
            });
            doc.save(`Reporte_Asistencia_${fechaFormateada.replace(/\//g, '-')}.pdf`);
        }
    </script>
</body>
</html>
